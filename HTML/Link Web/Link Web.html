<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Welcome to the Funhouse</title>
    <style>
        .body-1 {background-color: black;} 
        {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        h1 {
            text-align: center;
            color: red;
            font-weight: bold;
            padding: 20px 0;
        }
            h1:hover {
                color: yellow; /* Change color to yellow on hover */
                text-shadow: 0 0 10px red, 0 0 20px red, 0 0 30px red, 0 0 40px red; /* Add red glow effect */
            }

        h2 {
            text-align: center;
            color: black;
            font-style: italic;
            padding: 30px 0;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 0;
        }

        .signup-form {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 30px;
        }

            .signup-form input[type="text"],
            .signup-form input[type="email"] {
                width: 300px;
                height: 40px;
                padding: 5px;
                margin-bottom: 10px;
                border: 1px solid gray;
                border-radius: 10px; 

            }

            .signup-form input[type="submit"] {
                width: 300px;
                height: 40px;
                background-color: red;
                color: white;
                border: none;
                border-radius: 10px;
                cursor: pointer;
                transition: transform 0.5s;
        }

        .signup-form input[type="submit"]:hover {
            transform: rotateY(180deg);
        }

        .signup-form input[type="submit"]::after {
            content: src('skull-icon.png');
            display: none;
        }

        .signup-form input[type="submit"]:hover::after {
            display: block;
            }
    </style>
</head>
<body class="body-1">
    <div class="container">
        <h1>Welcome to the Funhouse</h1>
        <img src="Grimm Reaper.jpeg" alt=" An image of Grim Reaper.jpeg" style=" width:
     300px; border-radius: 30px; margin-top: 30px" 
        <h2>Sign up if you are brave enough</h2>
        <div class="signup-form">
            <input type="text" placeholder="Name" />
            <input type="email" placeholder="Email" />
            <input type="submit" value="Sign Up" />

    </div>
</body>
</html>
